hostname R2


interface Loopback0
 ip address 150.1.2.2 255.255.255.255
 no shutdown
!

interface GigabitEthernet1.12
 ip address 155.1.12.2 255.255.255.0
 no shutdown
!

interface GigabitEthernet1.24
 ip address 155.1.24.2 255.255.255.0
 no shutdown
!

interface GigabitEthernet1.241
 ip address 155.1.241.2 255.255.255.0
 no shutdown
!

interface GigabitEthernet1.2
 ip address 155.1.2.2 255.255.255.0
 no shutdown
!


router ospf 1
 router-id 2.2.2.2


 network 150.1.2.2 0.0.0.0 area 0

 network 155.1.12.0 0.0.0.255 area 0

 network 155.1.24.0 0.0.0.255 area 1

 network 155.1.241.0 0.0.0.255 area 1

 network 155.1.2.0 0.0.0.255 area 5


!
end