hostname R3


interface Loopback0
 ip address 150.1.3.3 255.255.255.255
 no shutdown
!

interface GigabitEthernet1.13
 ip address 155.1.13.3 255.255.255.0
 no shutdown
!

interface GigabitEthernet1.35
 ip address 155.1.35.3 255.255.255.0
 no shutdown
!

interface GigabitEthernet1.3
 ip address 155.1.3.3 255.255.255.0
 no shutdown
!


router ospf 1
 router-id 3.3.3.3


 network 150.1.3.3 0.0.0.0 area 2

 network 155.1.13.0 0.0.0.255 area 2

 network 155.1.35.0 0.0.0.255 area 4

 network 155.1.3.0 0.0.0.255 area 3


!
end