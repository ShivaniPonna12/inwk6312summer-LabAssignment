hostname R4


interface Loopback0
 ip address 150.1.4.4 255.255.255.255
 no shutdown
!

interface GigabitEthernet1.24
 ip address 155.1.24.4 255.255.255.0
 no shutdown
!

interface GigabitEthernet1.241
 ip address 155.1.241.4 255.255.255.0
 no shutdown
!


router ospf 1
 router-id 4.4.4.4


 network 150.1.4.4 0.0.0.0 area 1

 network 155.1.24.0 0.0.0.255 area 1

 network 155.1.241.0 0.0.0.255 area 1


!
end